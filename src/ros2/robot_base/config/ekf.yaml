ekf_filter_node:
  ros__parameters:
    frequency: 60.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: odom/unfiltered
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false, 
                   false, false, false, 
                   false, false, false]

    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true, 
                  false, false, false]

    odom0_queue_size: 1
    odom0_nodelay: false

    imu0_queue_size: 1
    imu0_nodelay: false

    # Параметры для сброса фильтра (важно для повторных запусков)
    reset_on_timeout: false
    print_diagnostics: true
