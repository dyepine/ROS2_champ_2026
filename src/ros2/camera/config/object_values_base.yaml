# Базовые стоимости объектов для соревнования
# Положительные значения - полезные объекты
# Отрицательные значения - объекты, которых нужно избегать

object_values:
  # Кубики с ArUco маркерами (ID от 1 до 50)
  # Положительные объекты (нужно собирать)
  cube_red_1:      # ID 1-5
    ids: [1, 2, 3, 4, 5]
    value: 20
    description: "Красные кубики - высокая стоимость"
    
  cube_blue_1:     # ID 6-10
    ids: [6, 7, 8, 9, 10]
    value: 15
    description: "Синие кубики - средняя стоимость"
    
  cube_green_1:    # ID 11-15
    ids: [11, 12, 13, 14, 15]
    value: 10
    description: "Зеленые кубики - низкая стоимость"
  
  # Отрицательные объекты (нужно избегать или вывозить в зону противника)
  cube_black_1:    # ID 16-20
    ids: [16, 17, 18, 19, 20]
    value: -15
    description: "Черные кубики - штрафные"
    
  cube_black_2:    # ID 21-25
    ids: [21, 22, 23, 24, 25]
    value: -10
    description: "Черные кубики - малый штраф"
  
  # Цилиндры (диаметр 50 мм)
  cylinder_gold:   # ID 26-30
    ids: [26, 27, 28, 29, 30]
    value: 25
    description: "Золотые цилиндры - очень высокая стоимость"
    
  cylinder_silver: # ID 31-35
    ids: [31, 32, 33, 34, 35]
    value: 18
    description: "Серебряные цилиндры - высокая стоимость"
    
  cylinder_bronze: # ID 36-40
    ids: [36, 37, 38, 39, 40]
    value: 12
    description: "Бронзовые цилиндры - средняя стоимость"
  
  # Объекты сложной формы (утки и т.д.)
  duck_yellow:     # ID 41-45
    ids: [41, 42, 43, 44, 45]
    value: 30
    description: "Желтые утки - специальные объекты"
    
  duck_red:        # ID 46-50
    ids: [46, 47, 48, 49, 50]
    value: -20
    description: "Красные утки - избегать!"

# Бонусы за зоны хранения
storage_bonus:
  team1: 15  # Дополнительные баллы за объект в зоне хранения команды 1
  team2: 15  # Дополнительные баллы за объект в зоне хранения команды 2

# Множители для зон начисления
zone_multipliers:
  A1: 1.0    # Стартовая зона команды 1
  A2: 1.2    # Зона A2 - повышенный множитель
  A3: 1.5    # Зона A3 - высокий множитель
  B1: 1.0    # Стартовая зона команды 2
  B2: 1.2    # Зона B2 - повышенный множитель
  B3: 1.5    # Зона B3 - высокий множитель
